name: build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Sign ad hoc
        run: |
          for b in $(find build -name '*.vst3' -type d); do
            codesign --force --deep -s - "$b"
          done
      - name: Pack
        run: |
          mkdir -p dist
          for b in $(find build -name '*.vst3' -type d); do
            ditto -c -k --keepParent "$b" "dist/$(basename "$b").zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: starz-mac
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Get-ChildItem build -Recurse -Filter '*.vst3' | Where-Object { -not $_.PSIsContainer } | Copy-Item -Destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: starz-windows
          path: dist/*.vst3
