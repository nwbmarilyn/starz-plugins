name: build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release > cfg.log 2>&1 || { grep -iE "error|fatal" cfg.log | head -8 | while read -r l; do echo "::error::${l:0:400}"; done; tail -5 cfg.log | while read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release > bld.log 2>&1 || { grep -E "error:|error LNK|fatal error|Error " bld.log | head -10 | while read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
      - name: Screenshots
        shell: bash
        run: |
          mkdir -p shots
          exe=$(find build -name StarzShots -type f | head -1)
          "$exe" shots > shots/log.txt 2>&1 && echo ok || { echo "::error::shots failed"; tail -5 shots/log.txt | while read -r l; do echo "::error::${l:0:300}"; done; }
          cat shots/log.txt
      - name: Publish screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p shots
          [ -f bld.log ] && grep -E "error|warning: unused" bld.log | head -60 > shots/build-errors.txt || true
          [ -f bld.log ] && tail -40 bld.log > shots/build-tail.txt || true
          [ -f cfg.log ] && tail -40 cfg.log > shots/cfg-tail.txt || true
          cp -r shots "$RUNNER_TEMP/shots"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-shots
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP"/shots/* .
          git add -f $(ls "$RUNNER_TEMP/shots")
          git commit -m "starz: снимки mac" > /dev/null
          git push -f origin ci-shots
      - name: Sign ad hoc
        run: |
          for b in $(find build -name 'Starz*.vst3' -type d); do
            codesign --force --deep -s - "$b"
          done
      - name: Pack
        run: |
          mkdir -p dist
          for b in $(find build -name 'Starz*.vst3' -type d); do
            ditto -c -k --keepParent "$b" "dist/$(basename "$b").zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: starz-mac
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -A x64 > cfg.log 2>&1 || { grep -iE "error|fatal" cfg.log | head -8 | while read -r l; do echo "::error::${l:0:400}"; done; tail -5 cfg.log | while read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release > bld.log 2>&1 || { grep -E "error:|error LNK|fatal error|Error " bld.log | head -10 | while read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-out | Out-Null
          $found = @(Get-ChildItem build -Recurse -Filter 'Starz*.vst3')
          if ($found.Count -eq 0) { Get-ChildItem build -Recurse -Include *.vst3,*.dll | ForEach-Object { Write-Host ("::error::" + $_.FullName) }; exit 1 }
          foreach ($i in $found) {
            if ($i.PSIsContainer) { Compress-Archive -Path $i.FullName -DestinationPath (Join-Path dist-out ($i.Name + '.zip')) -Force } else { Copy-Item $i.FullName dist-out }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: starz-windows
          path: dist-out/*
